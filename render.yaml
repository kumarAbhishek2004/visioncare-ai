# ==============================================================================
# VisionCare AI: Render Production Blueprint
# Optimized for Render Free Tier (512MB RAM · Single Worker · CPU PyTorch)
# ==============================================================================

services:
  - type: web
    name: visioncare-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
